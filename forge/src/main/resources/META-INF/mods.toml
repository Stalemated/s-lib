modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/Stalemated/s-lib/issues"
license = "MIT"
clientSideOnly = true

[[mods]]
modId = "s_lib"
version = "${version}"
displayName = "S-Lib"
authors = "Stalemated"
description = '''
A core utility library providing shared code for Stalemated's mods.
'''
logoFile = "META-INF/icon.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/s-lib"

[[mixins]]
config = "s-lib.mixins.json"

[[dependencies.s_lib]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.s_lib]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,)"
ordering = "NONE"
side = "CLIENT"
