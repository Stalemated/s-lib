modLoader = "javafml"
loaderVersion = "[1,)"
issueTrackerURL = "https://github.com/Stalemated/s-lib/issues"
license = "MIT"

[[mods]]
modId = "s_lib"
version = "${version}"
displayName = "S-Lib"
authors = "Stalemated"
description = '''
An easy to use general utility and config library.
'''
logoFile = "icon.png"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/s-lib"

[[mixins]]
config = "s-lib.mixins.json"

[[dependencies.s_lib]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.s_lib]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
